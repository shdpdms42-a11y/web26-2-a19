<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
   
    <title>4form_selectBasic</title>
</head>
<body>

    <h2>4선택가능한 입력 양식</h2>
    <select>
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>어묵</option>
    </select>

    <h2>여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>어묵</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <!-- optgroup태그를 사용해 선택 옵션을 그룹으로 묶음 -->
    <select>
        <optgroup lable="HTML5">
            <option>Multimedio</option>
            <option>Connectivity</option>
            <option>Device Access</option>
        </optgroup>
        <optgroup lable="CSS3">
            <option>Animation</option>
            <option>3D Transform</option>
        </optgroup>
    </select>
</body>
</html>
